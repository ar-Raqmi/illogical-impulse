<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
  </match>

  <!-- Prefer Noto Sans Arabic for Sans-Serif -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>

  <!-- Prefer Noto Naskh Arabic for Serif (often better for ﷺ) -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Naskh Arabic</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>
</fontconfig>
<!-- To apply changes, run: fc-cache -fv -->
